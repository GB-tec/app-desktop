<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <title>GbSoft - Login</title>
</head>

<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Criar Conta</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>ou use seu email para se registrar</span>
                <input type="email" placeholder="Insira seu email" required>
                <input type="password" placeholder="Senha (mín. 6 caracteres)" required>
                <button type="submit">Cadastrar</button>
            </form>
        </div>
        
        <div class="form-container sign-in">
            <form>
                <h1>Entrar</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>ou use seu email e senha</span>
                <input type="email" placeholder="Email" required id="emailLogin">
                <input type="password" placeholder="Senha" required id="senhaLogin">
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="manterConectado">
                        <span class="checkmark"></span>
                        Manter-me conectado
                        <span class="tooltip" title="Fazer login automaticamente na próxima visita">?</span>
                    </label>
                    <a href="#" class="link">Esqueceu sua senha?</a>
                </div>
                <button class="btn-login" type="button">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>
        </div>
        
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Insira seus dados pessoais para usar todos os recursos do site</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá, Amigo!</h1>
                    <p>Registre-se com seus dados pessoais para usar todos os recursos do site</p>
                    <button class="hidden" id="register">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Carregando...</p>
        </div>
    </div>

    <!-- Scripts Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- SweetAlert2 para notificações -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Configuração do Firebase -->
    <script>
        console.log('Inicializando Firebase...');
        
        const firebaseConfig = {
            apiKey: "AIzaSyBSKZO6JqTPQIaVsuMRF_NifGvuiLT2STc",
            authDomain: "controle-usuario-64b08.firebaseapp.com",
            projectId: "controle-usuario-64b08",
            storageBucket: "controle-usuario-64b08.firebasestorage.app",
            messagingSenderId: "1005734164997",
            appId: "1:1005734164997:web:0cfa0b869178aa4b947a6c"
        };
        
        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log('Firebase inicializado com sucesso');
        } else {
            console.log('Firebase já estava inicializado');
        }
        
        // Verificar se Firebase está funcionando
        setTimeout(() => {
            console.log('Firebase Auth:', !!firebase.auth);
            console.log('Firebase Firestore:', !!firebase.firestore);
            
            // Teste básico
            try {
                const auth = firebase.auth();
                const db = firebase.firestore();
                console.log('✅ Firebase configurado corretamente');
            } catch (error) {
                console.error('❌ Erro na configuração Firebase:', error);
            }
        }, 500);
    </script>
    
    <!-- Scripts da aplicação -->
    <script src="auth.js"></script>

    <!-- Estilos adicionais -->
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading-content {
            text-align: center;
            color: white;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Estilos para "Manter-me conectado" */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 14px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        
        .remember-me input[type="checkbox"] {
            display: none;
        }
        
        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid #512da8;
            border-radius: 3px;
            margin-right: 8px;
            position: relative;
            transition: all 0.3s ease;
            background: white;
        }
        
        .remember-me input[type="checkbox"]:checked + .checkmark {
            background-color: #512da8;
            border-color: #512da8;
        }
        
        .remember-me input[type="checkbox"]:checked + .checkmark::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .remember-me:hover .checkmark {
            border-color: #673ab7;
            transform: scale(1.05);
        }
        
        /* Tooltip para "Manter-me conectado" */
        .tooltip {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: #512da8;
            color: white;
            border-radius: 50%;
            text-align: center;
            font-size: 10px;
            line-height: 16px;
            margin-left: 5px;
            cursor: help;
            position: relative;
        }
        
        .tooltip:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
        }
        
        .tooltip:hover::before {
            content: '';
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top: 5px solid rgba(0, 0, 0, 0.9);
        }
        
        .error-message, .success-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        /* Estilos para campos com erro */
        input.error {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        
        /* Melhorias visuais nos botões */
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-loading {
            position: relative;
            color: transparent !important;
        }
        
        .btn-loading::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        /* Animação suave para transições */
        .form-container {
            transition: all 0.3s ease-in-out;
        }
        
        /* Responsividade melhorada */
        @media (max-width: 768px) {
            .container {
                min-height: 100vh;
                padding: 20px;
            }
            
            .form-container {
                padding: 20px;
            }
            
            .toggle-container {
                display: none;
            }
            
            .remember-forgot {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .tooltip:hover::after {
                display: none; /* Ocultar tooltip em mobile */
            }
        }
        
        /* Melhor feedback visual para links */
        .link:hover {
            color: #512da8;
            text-decoration: underline;
        }
        
        /* Animação para ícones sociais */
        .social-icons .icon:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }
        
        /* Animação de entrada suave */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .container {
            animation: fadeIn 0.6s ease-out;
        }
        
        /* Melhorias no loading overlay */
        .loading-overlay {
            backdrop-filter: blur(5px);
        }
        
        .loading-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        /* Validação visual melhorada */
        input:valid {
            border-color: #28a745;
        }
        
        input:invalid:not(:focus):not(:placeholder-shown) {
            border-color: #dc3545;
        }
        
        /* Animação para checkbox */
        .checkmark {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .remember-me input[type="checkbox"]:checked + .checkmark {
            animation: checkmarkPop 0.3s ease-out;
        }
        
        @keyframes checkmarkPop {
            0% {
                transform: scale(0.8);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        /* Status do login automático */
        .auto-login-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(81, 45, 168, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            animation: slideInRight 0.3s ease-out;
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Indicador de força da senha */
        .password-strength {
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-weak {
            width: 33%;
            background: #dc3545;
        }
        
        .strength-medium {
            width: 66%;
            background: #ffc107;
        }
        
        .strength-strong {
            width: 100%;
            background: #28a745;
        }
    </style>
</body>

</html>
